name: iOS Simulator Preview (App Store screenshots)

# There is no iOS Simulator on Windows, so the app is built and photographed on a
# macOS runner instead. No Apple certificate or provisioning profile is required:
# the build targets the Simulator, not a device.
#
# Before each launch the workflow writes preview-target.json into the app's data
# container, which names the screen to open and, on the first launch, asks the app
# to seed demo data first (DEBUG builds only, see src/preview/). Deep links and
# launch arguments were both tried and both lose: the app redirects to onboarding
# while its settings load, which swallowed the deep link and left every capture
# showing the welcome screen.
#
# Trigger from GitHub -> Actions -> "iOS Simulator Preview" -> Run workflow. It
# also runs on pushes to preview-* / ios-* branches, which deliberately do NOT
# trigger ios-build.yml's TestFlight upload.

on:
  workflow_dispatch:
  push:
    branches: [ 'preview-*', 'ios-*' ]
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - '.github/workflows/ios-simulator-preview.yml'

concurrency:
  group: ios-simulator-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'
  BUNDLE_ID: com.siteauditmax.app
  METRO_PORT: '8081'

jobs:
  capture:
    name: Capture ${{ matrix.family }} screenshots
    runs-on: macos-15
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - family: ipad
            artifact: SiteAuditMax-iPad-Screenshots
          - family: iphone
            artifact: SiteAuditMax-iPhone-Screenshots

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Select Xcode Version
        run: |
          set -euo pipefail
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selected Xcode: $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Create ${{ matrix.family }} Simulator
        id: sim
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail

          RUNTIME_ID=$(node scripts/pick-simulator.mjs runtime)
          echo "Runtime: $RUNTIME_ID"

          # Device types are ranked by preference in scripts/pick-simulator.mjs. The
          # iPad entry prefers a 12.9-inch model because its captures are 2048x2732,
          # the size App Store Connect already holds for this app's iPad slot; the
          # 13-inch M4 (2064x2752) is also accepted by Apple and is the fallback.
          DEVICE_TYPES=$(node scripts/pick-simulator.mjs devicetypes "$FAMILY")
          echo "Candidate device types:"; echo "$DEVICE_TYPES"

          UDID=""
          for DEVICE_TYPE in $DEVICE_TYPES; do
            if CREATE_OUT=$(xcrun simctl create "SiteAuditMax-Preview" "$DEVICE_TYPE" "$RUNTIME_ID" 2>&1); then
              UDID=$(printf '%s\n' "$CREATE_OUT" | tail -n 1)
              echo "Created simulator using: $DEVICE_TYPE"
              break
            fi
            echo "  candidate rejected: $DEVICE_TYPE -> $(printf '%s' "$CREATE_OUT" | head -n 1)"
            UDID=""
          done

          if [ -z "$UDID" ]; then
            echo "Could not create a $FAMILY simulator for runtime $RUNTIME_ID"
            exit 1
          fi

          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot Simulator
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build app for the Simulator (unsigned)
        run: |
          set -euo pipefail

          # prebuild normally generates a .xcworkspace once CocoaPods has run; fall
          # back to the .xcodeproj if it did not. `-print -quit` is used instead of
          # `| head -n 1` because piping find into head raises SIGPIPE, which
          # `set -o pipefail` turns into a failure.
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" -print -quit 2>/dev/null || true)
          if [ -n "$WORKSPACE" ]; then
            PROJECT_ARG="-workspace $WORKSPACE"
          else
            XCODEPROJ=$(find ios -maxdepth 1 -name "*.xcodeproj" -print -quit 2>/dev/null || true)
            if [ -z "$XCODEPROJ" ]; then
              echo "expo prebuild produced neither a .xcworkspace nor a .xcodeproj:"
              ls -la ios | head -n 40
              exit 1
            fi
            PROJECT_ARG="-project $XCODEPROJ"
          fi
          echo "Project: $PROJECT_ARG"

          APP_NAME=$(node -p "require('./app.json').expo.name")
          echo "App name from app.json: $APP_NAME"

          # shellcheck disable=SC2086
          SCHEMES=$(xcodebuild $PROJECT_ARG -list -json 2>/dev/null | node -e "
          let raw = '';
          process.stdin.on('data', (d) => { raw += d; });
          process.stdin.on('end', () => {
            try {
              const info = JSON.parse(raw);
              const schemes = (info.workspace || info.project || {}).schemes || [];
              process.stdout.write(schemes.join('\n') + '\n');
            } catch (e) {
              process.stdout.write('\n');
            }
          });
          ")
          echo "Schemes offered by the project:"
          printf '%s\n' "$SCHEMES"

          # CocoaPods adds its own schemes (Pods-SiteAuditMax). Those compile the
          # dependencies but produce no application bundle, so building one yields a
          # long, successful-looking build with no .app at all.
          SCHEME=$(APP_NAME="$APP_NAME" SCHEMES="$SCHEMES" node -e "
          const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, '');
          const all = (process.env.SCHEMES || '').split('\n').map((s) => s.trim()).filter(Boolean);
          const wanted = norm(process.env.APP_NAME || '');
          const app = all.filter((s) => !/^pods/i.test(s));
          const chosen =
            app.find((s) => norm(s) === wanted) || app.find((s) => norm(s).includes(wanted)) || '';
          process.stdout.write(chosen + '\n');
          ")
          if [ -z "$SCHEME" ]; then
            echo "No application scheme matched \"$APP_NAME\". Candidates were: $SCHEMES"
            exit 1
          fi
          echo "Scheme: $SCHEME"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"

          # shellcheck disable=SC2086
          xcodebuild build \
            $PROJECT_ARG \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Install app and photograph each screen
        env:
          CI: '1'
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"

          # `-print -quit` rather than piping into head, which would trip pipefail.
          APP_PATH=$(find build/simulator/Build/Products -maxdepth 2 -name "*.app" -type d -print -quit 2>/dev/null || true)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -maxdepth 6 -name "*.app" -type d -print -quit 2>/dev/null || true)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "Simulator build produced no application bundle."
            echo "Scheme was: ${SCHEME:-<unset>}"
            echo "Products directory (audited, so nothing is truncated away):"
            find build/simulator/Build/Products -maxdepth 3 -type d 2>/dev/null | sort | tail -n 80 || true
            exit 1
          fi
          echo "Installing $APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"

          APP_DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          echo "App data container: $APP_DATA"
          if [ ! -d "$APP_DATA/Documents" ]; then
            echo "No Documents directory inside the app container:"
            ls -la "$APP_DATA" || true
            exit 1
          fi
          TARGET_FILE="$APP_DATA/Documents/preview-target.json"

          # A Debug build loads its JavaScript from Metro instead of an embedded
          # bundle, so the bundler must be running and reachable on localhost for
          # the app to render at all. Debug (rather than Release) is deliberate:
          # it is what makes __DEV__ true, which is what enables the preview hook.
          npx expo start --port "$METRO_PORT" > metro.log 2>&1 &
          METRO_PID=$!

          finish() {
            kill "$METRO_PID" 2>/dev/null || true
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
          }
          trap finish EXIT

          echo "Waiting for Metro to become ready..."
          metro_ready=0
          for _ in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:$METRO_PORT/status" >/dev/null 2>&1; then
              metro_ready=1
              break
            fi
            sleep 3
          done
          if [ "$metro_ready" -ne 1 ]; then
            echo "Metro never became ready. Log tail:"
            tail -n 60 metro.log || true
            exit 1
          fi
          echo "Metro is ready."

          # The app asks for Expo Router's virtual entry, not /index.bundle, which
          # 404s for this project. Warming the URL the app really uses means the
          # first launch is not photographed while the bundle is still compiling.
          BUNDLE_URL="http://127.0.0.1:$METRO_PORT/.expo/.virtual-metro-entry.bundle?platform=ios&dev=true&minify=false"
          echo "Pre-warming $BUNDLE_URL (this is the slow part)..."
          curl -s --max-time 900 "$BUNDLE_URL" -o /tmp/bundle-preload.js || true
          BUNDLE_BYTES=$(wc -c < /tmp/bundle-preload.js 2>/dev/null || echo 0)
          echo "Pre-warmed bundle: $BUNDLE_BYTES bytes"
          if [ "${BUNDLE_BYTES:-0}" -lt 5000000 ]; then
            echo "::error::Pre-warm returned ${BUNDLE_BYTES} bytes, not a JavaScript bundle. The app would be photographed while still loading."
            head -c 400 /tmp/bundle-preload.js 2>/dev/null || true
            echo
            tail -n 40 metro.log || true
            exit 1
          fi

          # The app hides the status bar itself; this keeps it clean if any screen shows it.
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularBars 4 --wifiBars 3 || true

          mkdir -p screenshots

          xcrun simctl io "$UDID" recordVideo --codec=h264 --force screenshots/app-tour.mp4 &
          RECORD_PID=$!
          sleep 2

          # Each capture is a fresh launch that reads preview-target.json, so the app
          # always opens on the screen being photographed rather than wherever the
          # previous capture left it. Only the first launch seeds demo data.
          index=0
          seeding=true
          for screen in home project issue report folders; do
            index=$((index + 1))
            name=$(printf "%02d_%s" "$index" "$screen")

            xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
            printf '{"screen":"%s","seed":%s}' "$screen" "$seeding" > "$TARGET_FILE"
            echo "Capturing $screen (seed=$seeding)"
            seeding=false

            xcrun simctl launch "$UDID" "$BUNDLE_ID" >/dev/null
            sleep 25

            xcrun simctl io "$UDID" screenshot --type=png "screenshots/${name}.png"
            sleep 1
          done

          # simctl finalises the movie when it receives SIGINT.
          kill -INT "$RECORD_PID" || true
          wait "$RECORD_PID" || true
          if [ ! -s screenshots/app-tour.mp4 ]; then
            echo "::warning::Tour video was not produced; screenshots are unaffected."
          fi

          count=$(find screenshots -name "*.png" | wc -l | tr -d ' ')
          echo "Captured $count screenshots"
          if [ "$count" -lt 5 ]; then
            echo "Expected 5 screenshots, got $count"
            exit 1
          fi

          echo '--- app console output ---'
          grep -a "\[preview\]" metro.log | tail -n 30 || true
          echo '--- metro log tail ---'
          tail -n 25 metro.log || true

      - name: Verify the captures
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail

          for shot in screenshots/*.png; do
            W=$(sips -g pixelWidth "$shot" | awk '/pixelWidth/ {print $2}')
            H=$(sips -g pixelHeight "$shot" | awk '/pixelHeight/ {print $2}')
            echo "$shot  ${W}x${H}"
          done

          W=$(sips -g pixelWidth screenshots/01_home.png | awk '/pixelWidth/ {print $2}')
          H=$(sips -g pixelHeight screenshots/01_home.png | awk '/pixelHeight/ {print $2}')

          if [ "$FAMILY" = "ipad" ]; then
            case "${W}x${H}" in
              2048x2732|2064x2752)
                echo "iPad capture is ${W}x${H}, an accepted App Store iPad size."
                ;;
              *)
                echo "::error::iPad capture is ${W}x${H}, which App Store Connect will not accept as a 13-inch iPad screenshot (needs 2048x2732 or 2064x2752)."
                exit 1
                ;;
            esac
          else
            case "${W}x${H}" in
              1290x2796|1320x2868)
                echo "iPhone capture is ${W}x${H}, an accepted App Store iPhone size."
                ;;
              *)
                echo "::warning::iPhone capture is ${W}x${H}; expected 1290x2796 (6.7-inch) or 1320x2868 (6.9-inch)."
                ;;
            esac
          fi

          # Two byte-identical captures mean the app never navigated and is showing
          # the same screen twice: a plausible-looking but useless screenshot set.
          # This is the failure that a fixed sleep hides, so it is checked, not assumed.
          echo '--- checking that no two captures are identical ---'
          dupes=0
          for a in screenshots/*.png; do
            for b in screenshots/*.png; do
              if [ "$a" \< "$b" ] && cmp -s "$a" "$b"; then
                echo "::error::$a and $b are byte-identical, so the app did not move between them."
                dupes=$((dupes + 1))
              fi
            done
          done
          if [ "$dupes" -ne 0 ]; then
            echo "Found $dupes identical pair(s). App console output:"
            grep -a "\[preview\]" metro.log | tail -n 30 || true
            exit 1
          fi
          echo "All captures are distinct."

          ls -la screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: screenshots/
          if-no-files-found: warn

      - name: Clean up Simulator
        if: always()
        run: |
          xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" 2>/dev/null || true
          xcrun simctl delete "${{ steps.sim.outputs.udid }}" 2>/dev/null || true
