name: Build, Sign & Deploy Apple iOS App (Site Audit Max)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-sign-deploy:
    name: Build, Sign & Upload to TestFlight
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps

      - name: Expo Prebuild (Generate iOS Native Project)
        run: |
          npx expo prebuild --platform ios --clean

      - name: Select Xcode Version
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selected Xcode: $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install Apple Distribution Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_RAW=$RUNNER_TEMP/raw_cert.p12
          CERTIFICATE_PEM=$RUNNER_TEMP/cert_and_key.pem
          CERTIFICATE_LEGACY=$RUNNER_TEMP/legacy_cert.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)

          OPENSSL_BIN="/opt/homebrew/opt/openssl@3/bin/openssl"
          if [ ! -x "$OPENSSL_BIN" ]; then
            OPENSSL_BIN=$(which openssl)
          fi
          echo "Using OpenSSL from: $OPENSSL_BIN ($($OPENSSL_BIN version))"

          # Decode certificate and provisioning profile safely using Node.js (strips any whitespace / newline quirks)
          export CERTIFICATE_RAW PP_PATH
          node -e '
            const fs = require("fs");
            const cleanB64 = (s) => (s || "").replace(/[^A-Za-z0-9+/=]/g, "");
            fs.writeFileSync(process.env.CERTIFICATE_RAW, Buffer.from(cleanB64(process.env.BUILD_CERTIFICATE_BASE64), "base64"));
            fs.writeFileSync(process.env.PP_PATH, Buffer.from(cleanB64(process.env.PROVISIONING_PROFILE_BASE64), "base64"));
          '
          ls -la "$CERTIFICATE_RAW" "$PP_PATH"

          "$OPENSSL_BIN" pkcs12 -in $CERTIFICATE_RAW -passin pass:"$P12_PASSWORD" -nodes -out $CERTIFICATE_PEM
          "$OPENSSL_BIN" pkcs12 -export -in $CERTIFICATE_PEM -out $CERTIFICATE_LEGACY -passout pass:"$P12_PASSWORD" \
            -legacy -nomaciter -descert \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_LEGACY -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # Install provisioning profile under UUID and Profile Specifier name
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID="703a0658-caf8-4ddc-8db6-8a62535db492"
          PP_NAME="Site Audit Max AppStore Distribution"
          echo "Installing provisioning profile UUID: $PP_UUID, Name: $PP_NAME"
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/${PP_UUID}.mobileprovision
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PP_NAME}.mobileprovision" 2>/dev/null || true

      - name: Setup App Store Connect API Key
        env:
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          export KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          node -e '
            const fs = require("fs");
            const cleanB64 = (s) => (s || "").replace(/[^A-Za-z0-9+/=]/g, "");
            fs.writeFileSync(process.env.KEY_PATH, Buffer.from(cleanB64(process.env.ASC_KEY_BASE64), "base64"));
          '
          chmod 600 "$KEY_PATH"

      - name: Ensure Non-Exempt Encryption in Info.plist
        run: |
          INFO_PLIST=$(find ios -name "Info.plist" | head -n 1)
          if [ -f "$INFO_PLIST" ]; then
            echo "Configuring ITSAppUsesNonExemptEncryption in $INFO_PLIST"
            plutil -replace ITSAppUsesNonExemptEncryption -bool NO "$INFO_PLIST" || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$INFO_PLIST" || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$INFO_PLIST"
          fi

      - name: Create ExportOptions.plist
        run: |
          cat << 'EOF' > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>method</key>
          	<string>app-store-connect</string>
          	<key>testFlightInternalTestingOnly</key>
          	<false/>
          	<key>destination</key>
          	<string>export</string>
          	<key>signingStyle</key>
          	<string>manual</string>
          	<key>teamID</key>
          	<string>3BWVS7PL6M</string>
          	<key>provisioningProfiles</key>
          	<dict>
          		<key>com.siteauditmax.app</key>
          		<string>Site Audit Max AppStore Distribution</string>
          	</dict>
          	<key>signingCertificate</key>
          	<string>Apple Distribution</string>
          	<key>stripSwiftSymbols</key>
          	<true/>
          	<key>compileBitcode</key>
          	<false/>
          	<key>manageAppVersionAndBuildNumber</key>
          	<false/>
          </dict>
          </plist>
          EOF

      - name: Build and Archive iOS App
        working-directory: ios
        run: |
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          # List all schemes for diagnostics
          if [ -n "$WORKSPACE" ]; then
            xcodebuild -workspace "$WORKSPACE" -list || true
          fi
          
          # The application scheme generated by Expo for 'Site Audit Max' is 'SiteAuditMax'
          SCHEME="SiteAuditMax"
          echo "Selected Scheme: $SCHEME"

          if [ -z "$WORKSPACE" ]; then
            WORKSPACE=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
            xcodebuild clean archive \
              -project "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -archivePath build/SiteAuditMax.xcarchive \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              DEVELOPMENT_TEAM=3BWVS7PL6M \
              PROVISIONING_PROFILE="703a0658-caf8-4ddc-8db6-8a62535db492" \
              PROVISIONING_PROFILE_SPECIFIER="Site Audit Max AppStore Distribution"
          else
            xcodebuild clean archive \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -archivePath build/SiteAuditMax.xcarchive \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              DEVELOPMENT_TEAM=3BWVS7PL6M \
              PROVISIONING_PROFILE="703a0658-caf8-4ddc-8db6-8a62535db492" \
              PROVISIONING_PROFILE_SPECIFIER="Site Audit Max AppStore Distribution"
          fi

      - name: Export Signed IPA for App Store
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/SiteAuditMax.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/exported \
            -allowProvisioningUpdates

      - name: Validate App with App Store Connect
        run: |
          IPA_PATH=$(find ios/build/exported -name "*.ipa" | head -n 1)
          echo "Found IPA at: $IPA_PATH"
          # Xcode 26 altool can print VERIFY FAILED and still exit 0.
          log="$RUNNER_TEMP/altool-validate.log"
          set +e
          xcrun altool --validate-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}" \
            2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] || grep -E -q "VERIFY FAILED|UPLOAD FAILED" "$log"; then
            echo "altool validation failed (exit ${status})"
            exit 1
          fi

      - name: Upload App to TestFlight
        run: |
          IPA_PATH=$(find ios/build/exported -name "*.ipa" | head -n 1)
          echo "Uploading $IPA_PATH to TestFlight..."
          # Xcode 26 altool can print UPLOAD FAILED and still exit 0.
          log="$RUNNER_TEMP/altool-upload.log"
          set +e
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}" \
            2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] || grep -E -q "VERIFY FAILED|UPLOAD FAILED" "$log"; then
            echo "altool upload failed (exit ${status})"
            exit 1
          fi
          grep -E "Delivery UUID|UPLOAD SUCCEEDED|No errors uploading" "$log" || true

      # Read-only. Never creates a review submission or changes TestFlight groups.
      # continue-on-error keeps a diagnostic failure from failing the upload.
      - name: Diagnose App Store Connect build processing
        if: success()
        continue-on-error: true
        env:
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          node <<'NODE'
          'use strict';

          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');

          const APP_ID = '6821932661';
          const BUILD_VERSION = '7';
          const DEADLINE_MS = 20 * 60 * 1000;
          const INTERVAL_MS = 30 * 1000;
          const TERMINAL = new Set(['VALID', 'FAILED', 'INVALID']);

          function finish(code) {
            process.exit(code);
          }

          process.on('uncaughtException', (err) => {
            console.error('ASC diagnostic error (non-fatal):', err && err.message ? err.message : err);
            finish(0);
          });
          process.on('unhandledRejection', (err) => {
            const message = err && err.message ? err.message : err;
            console.error('ASC diagnostic error (non-fatal):', message);
            finish(0);
          });

          function loadPrivateKey() {
            const keyId = process.env.ASC_KEY_ID || '';
            const filePath = path.join(
              process.env.HOME || '',
              '.appstoreconnect',
              'private_keys',
              `AuthKey_${keyId}.p8`
            );
            if (keyId && fs.existsSync(filePath)) {
              return fs.readFileSync(filePath, 'utf8');
            }
            const b64 = (process.env.ASC_KEY_BASE64 || '').replace(/[^A-Za-z0-9+/=]/g, '');
            if (!b64) {
              throw new Error('App Store Connect API key is not available');
            }
            return Buffer.from(b64, 'base64').toString('utf8');
          }

          function makeToken(privateKeyPem) {
            const now = Math.floor(Date.now() / 1000);
            const header = Buffer.from(JSON.stringify({
              alg: 'ES256',
              kid: process.env.ASC_KEY_ID,
              typ: 'JWT',
            })).toString('base64url');
            const payload = Buffer.from(JSON.stringify({
              iss: process.env.ASC_ISSUER_ID,
              iat: now,
              exp: now + 10 * 60,
              aud: 'appstoreconnect-v1',
            })).toString('base64url');
            const signingInput = `${header}.${payload}`;
            const signature = crypto.sign('SHA256', Buffer.from(signingInput), {
              key: privateKeyPem,
              dsaEncoding: 'ieee-p1363',
            });
            if (signature.length !== 64) {
              throw new Error(`Unexpected ES256 signature length ${signature.length}`);
            }
            return `${signingInput}.${signature.toString('base64url')}`;
          }

          async function listBuilds(token) {
            const queries = [
              {
                'filter[app]': APP_ID,
                'filter[version]': BUILD_VERSION,
                sort: '-uploadedDate',
                limit: '5',
                'fields[builds]': 'processingState,version,uploadedDate,buildAudienceType,expired',
                include: 'preReleaseVersion',
                'fields[preReleaseVersions]': 'version,platform',
              },
              {
                'filter[app]': APP_ID,
                'filter[version]': BUILD_VERSION,
                sort: '-uploadedDate',
                limit: '5',
              },
            ];
            let lastError = null;
            for (const params of queries) {
              const url = new URL('https://api.appstoreconnect.apple.com/v1/builds');
              for (const [key, value] of Object.entries(params)) {
                url.searchParams.set(key, value);
              }
              const response = await fetch(url, {
                method: 'GET',
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: 'application/json',
                },
                signal: AbortSignal.timeout(30000),
              });
              const body = await response.text();
              if (response.ok) {
                return JSON.parse(body);
              }
              lastError = `HTTP ${response.status}: ${body.slice(0, 500)}`;
              console.log(`ASC list builds failed (${lastError}).`);
              if (response.status === 401 || response.status === 403 || response.status !== 400) {
                break;
              }
            }
            const error = new Error(lastError || 'list builds failed');
            error.auth = /HTTP 401|HTTP 403/.test(lastError || '');
            throw error;
          }

          function describe(payload) {
            const included = new Map((payload.included || []).map((item) => [item.id, item]));
            return (payload.data || []).map((build) => {
              const relation = build.relationships && build.relationships.preReleaseVersion && build.relationships.preReleaseVersion.data;
              const prerelease = relation ? included.get(relation.id) : null;
              const attributes = build.attributes || {};
              return {
                id: build.id,
                version: attributes.version ?? null,
                marketingVersion: prerelease && prerelease.attributes ? prerelease.attributes.version : null,
                processingState: attributes.processingState ?? null,
                buildAudienceType: attributes.buildAudienceType ?? null,
                uploadedDate: attributes.uploadedDate ?? null,
              };
            });
          }

          function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
          }

          async function main() {
            if (!process.env.ASC_KEY_ID || !process.env.ASC_ISSUER_ID) {
              console.log('ASC diagnostic skipped: API key id or issuer id is missing. Upload result is unchanged.');
              return;
            }
            const privateKeyPem = loadPrivateKey();
            const deadline = Date.now() + DEADLINE_MS;
            let lastMatch = null;
            let terminalSince = null;
            console.log(`ASC diagnostic: polling app ${APP_ID} build version ${BUILD_VERSION} for up to 20 minutes (GET /v1/builds only; no review submission).`);

            while (Date.now() < deadline) {
              try {
                const payload = await listBuilds(makeToken(privateKeyPem));
                const match = describe(payload)
                  .filter((build) => String(build.version) === BUILD_VERSION)
                  .sort((a, b) => String(b.uploadedDate).localeCompare(String(a.uploadedDate)))[0];
                if (!match) {
                  console.log(`No build version ${BUILD_VERSION} for app ${APP_ID} yet.`);
                  terminalSince = null;
                } else {
                  lastMatch = match;
                  console.log(`Build ${match.version} id=${match.id} processingState=${match.processingState} buildAudienceType=${match.buildAudienceType} uploadedDate=${match.uploadedDate} marketingVersion=${match.marketingVersion}`);
                  if (TERMINAL.has(match.processingState)) {
                    if (match.buildAudienceType) {
                      console.log(`ASC diagnostic final: ${JSON.stringify(match)}`);
                      return;
                    }
                    if (!terminalSince) terminalSince = Date.now();
                    if (Date.now() - terminalSince >= 90 * 1000) {
                      console.log(`ASC diagnostic final: ${JSON.stringify(match)}`);
                      return;
                    }
                  } else {
                    terminalSince = null;
                  }
                }
              } catch (err) {
                const message = err && err.message ? err.message : String(err);
                console.log(`Poll error (non-fatal): ${message}`);
                if (err && err.auth) {
                  console.log('ASC diagnostic stopped after an authentication error. Upload result is unchanged.');
                  return;
                }
              }
              const remaining = deadline - Date.now();
              if (remaining <= 0) break;
              await sleep(Math.min(INTERVAL_MS, remaining));
            }

            console.log('ASC diagnostic timed out after 20 minutes.');
            if (lastMatch) {
              console.log(`ASC diagnostic final: ${JSON.stringify(lastMatch)}`);
            } else {
              console.log(`ASC diagnostic final: build version ${BUILD_VERSION} was not visible yet.`);
            }
          }

          main().then(() => finish(0)).catch((err) => {
            console.error('ASC diagnostic error (non-fatal):', err && err.message ? err.message : err);
            finish(0);
          });
          NODE

      - name: Upload IPA Build Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SiteAuditMax-iOS-Package
          path: ios/build/exported/*.ipa
          if-no-files-found: ignore

      - name: Clean up Keychain & Secrets
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/*
